<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Modern Signage Player</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
    }

    /* ===== MODERN TRANSITION ===== */
    .media {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;

      opacity: 0;
      transform: scale(1.05);
      transition:
        opacity 700ms ease,
        transform 700ms ease;
      will-change: opacity, transform;
    }

    .media.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* ===== STATUS DOT ===== */
    #status {
      position: fixed;
      bottom: 18px;
      left: 18px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      z-index: 20;
      opacity: 0.95;
    }

    #status.online {
      background: #00ff00;
      box-shadow: 0 0 20px #00ff00;
    }

    #status.offline {
      background: #ff3b3b;
      box-shadow: 0 0 20px #ff3b3b;
    }

    /* optional manual refresh (testing only) */
    #controls {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 30;
    }
    #controls button {
      background: rgba(255,255,255,0.9);
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="controls">
  <button onclick="location.reload()">Refresh</button>
</div>

<div id="stage">
  <video id="videoA" class="media" autoplay muted playsinline preload="auto"></video>
  <video id="videoB" class="media" autoplay muted playsinline preload="auto"></video>
  <img id="image" class="media" />
</div>

<div id="status" class="offline"></div>

<script>
/* ================= CONFIG ================= */
const API_BASE = location.protocol === 'file:' 
  ? 'http://localhost:5000'
  : location.origin;

const PING_INTERVAL = 10000;
const STATUS_THRESHOLD = 30000;
const PLAYLIST_KEY = 'playlist_cache';

/* ================= STATUS ================= */
let lastPing = 0;
function updateStatus(online){
  document.getElementById('status').className = online ? 'online' : 'offline';
}

async function ping(){
  try {
    await fetch(API_BASE + '/api/player/ping', { method: 'POST' });
    lastPing = Date.now();
    updateStatus(true);
  } catch {
    updateStatus(false);
  }
}
setInterval(() => {
  updateStatus(Date.now() - lastPing < STATUS_THRESHOLD);
}, 5000);

/* ================= PLAYLIST ================= */
async function loadPlaylist(){
  try {
    const res = await fetch(API_BASE + '/api/player', { cache: 'no-store' });
    const data = await res.json();
    localStorage.setItem(PLAYLIST_KEY, JSON.stringify(data.playlist));
    return data.playlist;
  } catch {
    return JSON.parse(localStorage.getItem(PLAYLIST_KEY) || '[]');
  }
}

function resolveUrl(e){
  if (e.publicUrl) return e.publicUrl.startsWith('http')
    ? e.publicUrl
    : API_BASE + e.publicUrl;
  return '';
}

/* ================= PLAYER ================= */
const vA = document.getElementById('videoA');
const vB = document.getElementById('videoB');
const img = document.getElementById('image');

let currentVideo = vA;
let index = 0;
let playlist = [];

function setVisible(el, show){
  el.classList.toggle('visible', show);
}

function standby(){
  return currentVideo === vA ? vB : vA;
}

function playNext(){
  const item = playlist[index % playlist.length];
  const nextIndex = (index + 1) % playlist.length;

  if (item.type === 'video') {
    const nextVid = standby();
    nextVid.src = resolveUrl(item);
    nextVid.load();

    nextVid.oncanplay = () => {
      setVisible(nextVid, true);
      setTimeout(() => setVisible(currentVideo, false), 60);

      nextVid.play();
      nextVid.onended = () => {
        currentVideo = nextVid;
        index = nextIndex;
        playNext();
      };
    };
  } else {
    img.src = resolveUrl(item);
    setVisible(img, true);
    setTimeout(() => setVisible(currentVideo, false), 60);

    setTimeout(() => {
      setVisible(img, false);
      index = nextIndex;
      playNext();
    }, (item.durationSec || 10) * 1000);
  }
}

/* ================= START ================= */
(async function start(){
  ping();
  setInterval(ping, PING_INTERVAL);

  playlist = await loadPlaylist();
  if (!playlist.length) return;

  setVisible(vA, false);
  setVisible(vB, false);
  setVisible(img, false);

  playNext();
})();
</script>

</body>
</html>
