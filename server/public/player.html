<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Signage Player</title>

<style>
html,body{
  height:100%;
  margin:0;
  background:#000;
  overflow:hidden;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
#stage{
  position:fixed;
  inset:0;
  background:#000;
}
video,img{
  position:absolute;
  inset:0;
  max-width:100vw;
  max-height:100vh;
}
.hidden{
  opacity:0;
  pointer-events:none;
}
#status{
  position:fixed;
  bottom:18px;
  left:18px;
  width:36px;
  height:36px;
  border-radius:50%;
  z-index:20;
  opacity:.9;
}
#status.online{
  background:#00ff00;
  box-shadow:0 0 18px #00ff00;
}
#status.offline{
  background:#ff3b3b;
  box-shadow:0 0 18px #ff3b3b;
}
</style>
</head>

<body>

<div id="stage">
  <!-- DOUBLE BUFFER -->
  <video id="v1" autoplay muted playsinline></video>
  <video id="v2" autoplay muted playsinline class="hidden"></video>

  <img id="i1" src="/offline.jpg">
  <img id="i2" class="hidden">
</div>

<div id="status" class="offline"></div>

<script>
const API_BASE = location.search.includes("api=")
  ? new URLSearchParams(location.search).get("api")
  : location.origin;

const STORAGE_KEY = "signage_playlist";
const statusDot = document.getElementById("status");

const v1 = document.getElementById("v1");
const v2 = document.getElementById("v2");
const i1 = document.getElementById("i1");
const i2 = document.getElementById("i2");

let activeV = v1, bufferV = v2;
let activeI = i1, bufferI = i2;

let playlist = [];
let idx = 0;

/* ---------- STATUS ---------- */
function setStatus(ok){
  statusDot.className = ok ? "online" : "offline";
}

/* ---------- FETCH PLAYLIST (OFFLINE SAFE) ---------- */
async function loadPlaylist(){
  try{
    const r = await fetch(`${API_BASE}/api/player`,{cache:"no-store"});
    if(!r.ok) throw "";
    const d = await r.json();
    localStorage.setItem(STORAGE_KEY,JSON.stringify(d));
    setStatus(true);
    return d.playlist||[];
  }catch{
    setStatus(false);
    const c = localStorage.getItem(STORAGE_KEY);
    return c ? (JSON.parse(c).playlist||[]) : [];
  }
}

/* ---------- URL ---------- */
function resolveUrl(e){
  if(e.publicUrl){
    if(/^https?:\/\//i.test(e.publicUrl)) return e.publicUrl;
    return API_BASE + (e.publicUrl.startsWith("/")?"":"/") + e.publicUrl;
  }
  if(e.storedFilename) return `${API_BASE}/uploads/${e.storedFilename}`;
  return "";
}

/* ---------- VIDEO (PRELOAD + SWAP) ---------- */
function playVideo(url){
  bufferV.src = url;
  bufferV.oncanplay = () => {
    bufferV.classList.remove("hidden");
    activeV.classList.add("hidden");
    activeV.pause();

    [activeV, bufferV] = [bufferV, activeV];
    activeV.play().catch(()=>{});
  };
}

/* ---------- IMAGE (PRELOAD + SWAP) ---------- */
function showImage(url, duration){
  bufferI.onload = () => {
    bufferI.classList.remove("hidden");
    activeI.classList.add("hidden");
    [activeI, bufferI] = [bufferI, activeI];
  };
  bufferI.src = url;

  setTimeout(nextItem, duration);
}

/* ---------- PLAY NEXT ---------- */
function nextItem(){
  if(!playlist.length) return;

  const e = playlist[idx];
  const url = resolveUrl(e);

  if(e.type==="video"){
    playVideo(url);
    activeV.onended = nextItem;
  }else{
    showImage(url,(e.durationSec||10)*1000);
  }

  idx = (idx+1) % playlist.length;
}

/* ---------- START ---------- */
(async function start(){
  playlist = await loadPlaylist();
  nextItem();
})();

/* ---------- AUTO UPDATE ---------- */
setInterval(async ()=>{
  if(!navigator.onLine) return;
  const fresh = await loadPlaylist();
  if(JSON.stringify(fresh.map(x=>x.contentId)) !== JSON.stringify(playlist.map(x=>x.contentId))){
    playlist = fresh;
    idx = 0;
    nextItem();
  }
},15000);

/* ---------- NETWORK EVENTS ---------- */
window.addEventListener("offline",()=>setStatus(false));
window.addEventListener("online",()=>location.reload());
</script>

</body>
</html>
