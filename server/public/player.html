<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signage Player</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
    }

    video, img {
      max-width: 100vw;
      max-height: 100vh;
    }

    .hidden { display: none; }

    #controls {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 30;
    }

    #controls button {
      background: rgba(255,255,255,0.9);
      color: #111;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
    }

    /* STATUS DOT */
    #status {
      position: fixed;
      bottom: 18px;
      left: 18px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      z-index: 25;
      opacity: 0.95;
    }

    #status.online {
      background: #00ff00;
      box-shadow: 0 0 20px #00ff00;
    }

    #status.offline {
      background: #ff3b3b;
      box-shadow: 0 0 20px #ff3b3b;
    }
  </style>
</head>

<body>

  <!-- CONTROLS -->
  <div id="controls">
    <button onclick="location.reload()">Refresh</button>
  </div>

  <!-- CONTENT -->
  <div id="stage">
    <video id="video" class="hidden" autoplay muted playsinline></video>
    <img id="image" class="hidden" />
  </div>

  <!-- STATUS DOT -->
  <div id="status" class="offline"></div>

<script>
  const search = new URLSearchParams(location.search);
  const paramApiBase = search.get('api') || localStorage.getItem('apiBase');
  const isFile = location.protocol === 'file:';
  const defaultApiBase = isFile ? 'http://localhost:5000' : location.origin;
  const API_BASE = paramApiBase || defaultApiBase;
  if (paramApiBase) localStorage.setItem('apiBase', paramApiBase);

  const PING_INTERVAL_MS = 10000;
  const RELOAD_INTERVAL_MS = 20000;
  const STATUS_THRESHOLD_MS = 30000;
  const STORAGE_KEY = 'signage_playlist';

  let lastPingAt = 0;

  function getDeviceId() {
    let id = localStorage.getItem('playerId');
    if (!id) {
      id = 'device_' + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('playerId', id);
    }
    return id;
  }

  function updateStatusUI(isOnline) {
    document.getElementById("status").className = isOnline ? "online" : "offline";
  }

  async function ping() {
    try {
      await fetch(`${API_BASE}/api/player/ping`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          playerId: getDeviceId(),
          info: { ua: navigator.userAgent, online: navigator.onLine }
        })
      });
      lastPingAt = Date.now();
      updateStatusUI(true);
    } catch {
      updateStatusUI(false);
    }
  }

  setInterval(() => {
    updateStatusUI(Date.now() - lastPingAt < STATUS_THRESHOLD_MS);
  }, 5000);

  async function loadPlaylistOnce() {
    try {
      const res = await fetch(`${API_BASE}/api/player`, { cache: 'no-store' });
      if (!res.ok) throw new Error();
      const data = await res.json();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      return data;
    } catch {
      const cached = localStorage.getItem(STORAGE_KEY);
      return cached ? JSON.parse(cached) : { playlist: [] };
    }
  }

  function resolveUrl(e) {
    if (e.publicUrl) {
      if (/^https?:\/\//i.test(e.publicUrl)) return e.publicUrl;
      return `${API_BASE}${e.publicUrl.startsWith('/') ? '' : '/'}${e.publicUrl}`;
    }
    if (e.storedFilename) return `${API_BASE}/uploads/${e.storedFilename}`;
    return '';
  }

  let epoch = 0;

  function playPlaylistLoop(list) {
    const v = document.getElementById("video");
    const i = document.getElementById("image");
    const myEpoch = ++epoch;
    let idx = 0;

    function next() {
      if (myEpoch !== epoch) return;

      if (!list.length) {
        i.classList.remove("hidden");
        v.classList.add("hidden");
        i.src = "";
        setTimeout(next, 3000);
        return;
      }

      const e = list[idx];
      const url = resolveUrl(e);

      if (e.type === "video") {
        v.src = url;
        i.classList.add("hidden");
        v.classList.remove("hidden");
        v.play().catch(() => {});
        v.onended = () => {
          idx = (idx + 1) % list.length;
          next();
        };
      } else {
        i.src = url;
        v.classList.add("hidden");
        i.classList.remove("hidden");
        setTimeout(() => {
          idx = (idx + 1) % list.length;
          next();
        }, (e.durationSec || 10) * 1000);
      }
    }
    next();
  }

  async function reloadPlaylist() {
    const d = await loadPlaylistOnce();
    const latest = d.playlist || [];
    const sig = JSON.stringify(latest.map(e => resolveUrl(e)));
    if (sig !== window._sig) {
      window._sig = sig;
      playPlaylistLoop(latest);
    }
  }

  (async function start() {
    ping();
    setInterval(ping, PING_INTERVAL_MS);
    const d = await loadPlaylistOnce();
    window._sig = JSON.stringify((d.playlist || []).map(e => resolveUrl(e)));
    playPlaylistLoop(d.playlist || []);
    setInterval(reloadPlaylist, RELOAD_INTERVAL_MS);
  })();
</script>

</body>
</html>
