
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signage Player</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
    }

    video, img {
      max-width: 100vw;
      max-height: 100vh;
    }

    .hidden { display: none; }

    #controls {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 30;
    }

    #controls button {
      background: rgba(255,255,255,0.9);
      color: #111;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
    }

    /* ===== STATUS DOT (BOTTOM LEFT, DOUBLE SIZE) ===== */
    #status {
      position: fixed;
      bottom: 18px;
      left: 18px;
      width: 36px;          /* double size */
      height: 36px;         /* double size */
      border-radius: 50%;
      z-index: 25;
      opacity: 0.95;
    }

    #status.online {
      background: #00ff00;
      box-shadow: 0 0 20px #00ff00;
    }

    #status.offline {
      background: #ff3b3b;
      box-shadow: 0 0 20px #ff3b3b;
    }
    #transition {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      transition: opacity 180ms ease;
      pointer-events: none;
      z-index: 18;
    }
    #transition.show { opacity: 1; }
  </style>
</head>

<body>

  <!-- CONTROLS -->
  <!-- <div id="controls">
    <button onclick="location.reload()">Refresh</button>
  </div> -->

  <!-- CONTENT -->
  <div id="stage">
    <video id="video" class="hidden" autoplay muted playsinline></video>
    <img id="image" class="hidden"  />
  </div>

  <!-- STATUS DOT -->
  <div id="status" class="offline"></div>
  <div id="transition"></div>

<script>
  const search = new URLSearchParams(location.search);
  const paramApiBase = search.get('api') || localStorage.getItem('apiBase');
  const isFile = location.protocol === 'file:';
  const defaultApiBase = isFile ? 'http://localhost:5000' : location.origin;
  const API_BASE = paramApiBase || defaultApiBase;
  if (paramApiBase) localStorage.setItem('apiBase', paramApiBase);

  const PING_INTERVAL_MS = 10000;
  const RELOAD_INTERVAL_MS = 20000;
  const STATUS_THRESHOLD_MS = 30000;
  const STORAGE_KEY = 'signage_playlist';

  let lastPingAt = 0;

  function getDeviceId() {
    let id = localStorage.getItem('playerId');
    if (!id) {
      id = 'device_' + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('playerId', id);
    }
    return id;
  }

  function updateStatusUI(isOnline) {
    const el = document.getElementById("status");
    el.className = isOnline ? "online" : "offline";
  }

  async function ping() {
    try {
      await fetch(`${API_BASE}/api/player/ping`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          playerId: getDeviceId(),
          info: { ua: navigator.userAgent, online: navigator.onLine }
        })
      });

      lastPingAt = Date.now();
      updateStatusUI(true);
    } catch {
      updateStatusUI(false);
    }
  }

  setInterval(() => {
    updateStatusUI(Date.now() - lastPingAt < STATUS_THRESHOLD_MS);
  }, 5000);

  async function loadPlaylistOnce() {
    try {
      const res = await fetch(`${API_BASE}/api/player`, { cache: 'no-store' });
      if (!res.ok) throw new Error();
      const data = await res.json();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      return data;
    } catch {
      const cached = localStorage.getItem(STORAGE_KEY);
      return cached ? JSON.parse(cached) : { playlist: [] };
    }
  }

  function resolveUrl(e) {
    if (e.publicUrl) {
      if (/^https?:\/\//i.test(e.publicUrl)) return e.publicUrl;
      return `${API_BASE}${e.publicUrl.startsWith('/') ? '' : '/'}${e.publicUrl}`;
    }
    if (e.storedFilename) return `${API_BASE}/uploads/${e.storedFilename}`;
    return '';
  }

  let epoch = 0;
  function currentInfo() {
    const v = document.getElementById("video");
    const i = document.getElementById("image");
    if (!v.classList.contains("hidden")) {
      return { kind: "video", url: v.src, t: Math.floor(v.currentTime || 0) };
    }
    if (!i.classList.contains("hidden")) {
      return { kind: "image", url: i.src };
    }
    return null;
  }

  function playPlaylistLoop(list, opt) {
    const v = document.getElementById("video");
    const i = document.getElementById("image");
    const myEpoch = ++epoch;
    let idx = 0;
    if (opt && opt.startUrl) {
      const pos = list.findIndex((e) => resolveUrl(e) === opt.startUrl);
      idx = pos >= 0 ? pos : 0;
    }

    async function next() {
      if (myEpoch !== epoch) return;

      if (!list.length) {
        i.classList.remove("hidden");
        v.classList.add("hidden");
        i.src = "";
        setTimeout(next, 3000);
        return;
      }

      const e = list[idx];
      const url = resolveUrl(e);

      if (e.type === "video") {
        const tr = document.getElementById("transition");
        tr.classList.add("show");
        v.src = url;
        i.classList.add("hidden");
        v.classList.remove("hidden");
        v.onloadedmetadata = () => {
          if (opt && opt.startUrl && resolveUrl(e) === opt.startUrl && typeof opt.t === "number" && opt.t > 0) {
            try { v.currentTime = opt.t; } catch {}
          }
        };
        try { await v.play(); } catch {}
        setTimeout(() => { tr.classList.remove("show"); }, 180);
        v.onended = () => { idx = (idx + 1) % list.length; next(); };
      } else {
        const tr = document.getElementById("transition");
        tr.classList.add("show");
        i.src = url;
        v.classList.add("hidden");
        i.classList.remove("hidden");
        const waitMs = (e.durationSec || 10) * 1000;
        setTimeout(() => { tr.classList.remove("show"); }, 180);
        setTimeout(() => { idx = (idx + 1) % list.length; next(); }, waitMs);
      }
    }
    next();
  }

  async function reloadPlaylist() {
    const info = currentInfo();
    const d = await loadPlaylistOnce();
    const latest = d.playlist || [];
    const latestSig = JSON.stringify(latest.map((e) => ({ u: resolveUrl(e), t: e.type, d: e.durationSec })));
    if (!window._lastSig) window._lastSig = latestSig;
    if (latestSig !== window._lastSig) {
      window._lastSig = latestSig;
      const opt = info ? { startUrl: info.url, t: info.t } : null;
      playPlaylistLoop(latest, opt);
    }
  }

  (async function start() {
    ping();
    setInterval(ping, PING_INTERVAL_MS);
    const d = await loadPlaylistOnce();
    const list = d.playlist || [];
    window._lastSig = JSON.stringify(list.map((e) => ({ u: resolveUrl(e), t: e.type, d: e.durationSec })));
    playPlaylistLoop(list);
    setInterval(reloadPlaylist, RELOAD_INTERVAL_MS);
  })();
</script>

</body>
</html>
