<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signage Player</title>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
    }

    video,
    img {
      max-width: 100vw;
      max-height: 100vh;
    }

    .hidden {
      display: none
    }

    #status {
      position: fixed;
      bottom: 18px;
      left: 18px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      z-index: 20;
      opacity: .9
    }

    #status.online {
      background: #00ff00;
      box-shadow: 0 0 18px #00ff00
    }

    #status.offline {
      background: #ff3b3b;
      box-shadow: 0 0 18px #ff3b3b
    }
  </style>
</head>

<body>

  <div id="stage">
    <video id="video" class="hidden" autoplay muted playsinline></video>
    <img id="image" class="hidden" src="/offline.jpg">
  </div>

  <div id="status" class="offline"></div>

  <script>
    const API_BASE = location.search.includes("api=")
      ? new URLSearchParams(location.search).get("api")
      : location.origin;

    const STORAGE_KEY = "signage_playlist";
    const STATE_KEY = "resume_state";

    const video = document.getElementById("video");
    const image = document.getElementById("image");
    const statusDot = document.getElementById("status");

    let epoch = 0;
    let lastSig = null;

    /* ---------- STATUS DOT ---------- */
    function setStatus(ok) {
      statusDot.className = ok ? "online" : "offline";
    }

    /* ---------- FETCH PLAYLIST (OFFLINE SAFE) ---------- */
    async function loadPlaylist() {
      try {
        const r = await fetch(`${API_BASE}/api/player`, { cache: "no-store" });
        if (!r.ok) throw "";
        const d = await r.json();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
        setStatus(true);
        return d;
      } catch {
        setStatus(false);
        const c = localStorage.getItem(STORAGE_KEY);
        return c ? JSON.parse(c) : { playlist: [] };
      }
    }

    /* ---------- URL RESOLVE ---------- */
    function resolveUrl(e) {
      if (e.publicUrl) {
        if (/^https?:\/\//i.test(e.publicUrl)) return e.publicUrl;
        return API_BASE + (e.publicUrl.startsWith("/") ? "" : "/") + e.publicUrl;
      }
      if (e.storedFilename) return `${API_BASE}/uploads/${e.storedFilename}`;
      return "";
    }

    /* ---------- PLAY LOOP (NO BLANK EVER) ---------- */
    function playLoop(list) {
      if (!list.length) return; // ❗ NOTHING CLEARED

      const myEpoch = ++epoch;
      let idx = 0;

      function next() {
        if (myEpoch !== epoch) return;

        const e = list[idx];
        const url = resolveUrl(e);

        if (e.type === "video") {
          video.src = url;
          image.classList.add("hidden");
          video.classList.remove("hidden");
          video.play().catch(() => { });
          video.onended = () => {
            idx = (idx + 1) % list.length;
            next();
          };
        } else {
          image.src = url;
          video.classList.add("hidden");
          image.classList.remove("hidden");
          setTimeout(() => {
            idx = (idx + 1) % list.length;
            next();
          }, (e.durationSec || 10) * 1000);
        }
      }
      next();
    }

    /* ---------- INITIAL START ---------- */
    (async function start() {
      const d = await loadPlaylist();
      const list = d.playlist || [];
      lastSig = JSON.stringify(list.map(x => x.contentId));
      playLoop(list);
    })();

    /* ---------- RELOAD ONLY WHEN ONLINE ---------- */
    setInterval(async () => {
      if (!navigator.onLine) return;
      const d = await loadPlaylist();
      const list = d.playlist || [];
      const sig = JSON.stringify(list.map(x => x.contentId));
      if (sig !== lastSig) {
        lastSig = sig;
        playLoop(list);
      }
    }, 15000);

    /* ---------- NETWORK EVENTS ---------- */
    window.addEventListener("offline", () => setStatus(false));
    window.addEventListener("online", () => location.reload());
  </script>

</body>

</html>
